<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANI Attendance Scanner</title><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><style>:root{--n:#003b5c;--b:#0072ce;--g:#087f5b;--bad:#b42318;--bg:#eef3f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#243746}header{background:linear-gradient(120deg,var(--n),var(--b));color:#fff;padding:22px}.w{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #003b5c18}.scanner{height:520px;background:#101827;border-radius:16px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.frame{position:absolute;width:min(65%,320px);aspect-ratio:1;border:3px solid #fff;border-radius:22px}.frame:after{content:"";position:absolute;left:8%;right:8%;height:3px;top:10%;background:#2bd3a2;box-shadow:0 0 12px #2bd3a2;animation:s 2s infinite}@keyframes s{50%{top:88%}}button{border:0;border-radius:9px;padding:11px 15px;background:var(--b);color:#fff;font-weight:bold}.danger{background:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{padding:14px;border-radius:10px;background:#f4f7f9;margin-top:12px}.good{background:#dcfae6;color:#067647}.bad{background:#fee4e2;color:#b42318}.muted{color:#64748b;font-size:13px}@media(max-width:600px){.scanner{height:430px}}</style></head><body><header><div class="w"><h1>ANI Attendance Scanner</h1><div>Secure camera scanner for an active class session</div></div></header><main class="w"><div id="config" class="card"></div><div class="card"><div class="scanner"><video id="video" playsinline muted></video><canvas id="canvas" hidden></canvas><div id="placeholder">Camera is off</div><div class="frame"></div></div><div class="actions"><button id="start">Start Camera</button><button id="switch">Switch Camera</button><button id="stop" class="danger">Stop</button></div><div id="result" class="result">Ready.</div></div></main><script>(function(){'use strict';var p=new URLSearchParams(location.search),session=p.get('session')||'',token=p.get('token')||'',endpoint=p.get('endpoint')||'',stream=null,raf=null,facing='environment',busy=false,last='',cooldown=1800;function q(x){return document.getElementById(x)}function show(text,type){q('result').textContent=text;q('result').className='result '+(type||'')}function config(){if(!session||!token||!endpoint){q('config').innerHTML='<b>Invalid scanner link.</b><p>Open this page from the Lecturer Attendance module.</p>';q('start').disabled=true}else q('config').innerHTML='<b>Scanner session ready.</b><p class="muted">Session: '+session.slice(0,12)+'... The temporary token is kept only in this page URL.</p>'}async function start(){stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});q('video').srcObject=stream;await q('video').play();q('placeholder').style.display='none';show('Camera active. Present a student QR code.');loop()}catch(e){show('Camera error: '+e.message,'bad')}}function stop(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;q('video').srcObject=null;q('placeholder').style.display='block'}function loop(){var v=q('video'),c=q('canvas');if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);var d=x.getImageData(0,0,c.width,c.height),r=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});if(r&&r.data&&r.data!==last&&!busy){last=r.data;send(r.data)}}raf=requestAnimationFrame(loop)}function send(qr){busy=true;show('QR detected. Recording...');fetch(endpoint,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'scanAttendanceExternal',sessionId:session,scannerToken:token,qrToken:qr})}).then(function(){show('Scan sent. Check the lecturer roster for confirmation.','good');if(navigator.vibrate)navigator.vibrate([80,40,120])}).catch(function(e){show('Network error: '+e.message,'bad')}).finally(function(){setTimeout(function(){busy=false;last='';show('Ready for next student.')},cooldown)})}q('start').onclick=start;q('stop').onclick=stop;q('switch').onclick=function(){facing=facing==='environment'?'user':'environment';start()};config()})();</script></body></html>
