<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANI Attendance Scanner</title><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>:root{--n:#003b5c;--b:#0072ce;--g:#067647;--o:#b54708;--r:#b42318;--bg:#eef3f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#243746}header{background:linear-gradient(120deg,var(--n),var(--b));color:#fff;padding:22px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #003b5c18}.scanner{height:520px;background:#101827;border-radius:16px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.frame{position:absolute;width:min(65%,320px);aspect-ratio:1;border:3px solid #fff;border-radius:22px}.frame:after{content:"";position:absolute;left:8%;right:8%;height:3px;top:10%;background:#2bd3a2;box-shadow:0 0 12px #2bd3a2;animation:scan 2s infinite}@keyframes scan{50%{top:88%}}button{border:0;border-radius:9px;padding:11px 15px;background:var(--b);color:#fff;font-weight:bold;cursor:pointer}.danger{background:var(--r)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{padding:14px;border-radius:10px;background:#f4f7f9;margin-top:12px}.good{background:#dcfae6;color:var(--g)}.bad{background:#fee4e2;color:var(--r)}.muted{color:#64748b;font-size:13px}.scan-modal{position:fixed;inset:0;background:#0f172acc;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.scan-modal.show{display:flex}.scan-card{width:min(520px,100%);background:#fff;border-radius:22px;padding:25px;text-align:center;box-shadow:0 25px 70px #0006;border-top:10px solid var(--g);animation:pop .2s ease}.scan-card.late{border-color:var(--o)}.scan-card.error{border-color:var(--r)}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}.scan-icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dcfae6;color:var(--g);font-size:40px;font-weight:bold}.late .scan-icon{background:#fff4e5;color:var(--o)}.error .scan-icon{background:#fee4e2;color:var(--r)}.scan-name{font-size:30px;font-weight:800;color:var(--n);margin:14px 0 5px}.scan-status{font-size:23px;font-weight:800;color:var(--g)}.late .scan-status{color:var(--o)}.error .scan-status{color:var(--r)}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0;text-align:left}.info{background:#f4f7f9;border-radius:10px;padding:10px}.info span{display:block;font-size:11px;color:#64748b;text-transform:uppercase}.info b{display:block;margin-top:4px}.countdown{font-size:12px;color:#64748b}@media(max-width:600px){.scanner{height:430px}.info-grid{grid-template-columns:1fr}.scan-name{font-size:24px}}</style></head>
<body><header><div class="wrap"><h1>ANI Attendance Scanner</h1><div>External secure camera scanner</div></div></header><main class="wrap"><div id="config" class="card"></div><div class="card"><div class="scanner"><video id="video" playsinline muted></video><canvas id="canvas" hidden></canvas><div id="placeholder">Camera is off</div><div class="frame"></div></div><div class="actions"><button id="start">Start Camera</button><button id="switch">Switch Camera</button><button id="stop" class="danger">Stop</button></div><div id="result" class="result">Ready.</div></div></main>
<div id="scanModal" class="scan-modal" role="dialog" aria-live="assertive"><div id="scanCard" class="scan-card"><div id="scanIcon" class="scan-icon">✓</div><div id="scanStatus" class="scan-status">ATTENDANCE RECORDED</div><div id="scanName" class="scan-name"></div><div id="scanDetails" class="info-grid"></div><div id="scanMessage" class="muted"></div><div class="countdown">Scanner resumes automatically</div></div></div>
<script>(function(){'use strict';var p=new URLSearchParams(location.search),session=p.get('session')||'',token=p.get('token')||'',endpoint=p.get('endpoint')||'',stream=null,raf=null,facing='environment',busy=false,last='',cooldown=3200;function q(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function show(t,type){q('result').textContent=t;q('result').className='result '+(type||'')}function configure(){if(!session||!token||!endpoint){q('config').innerHTML='<b>Invalid scanner link.</b><p>Open this scanner from Lecturer Attendance.</p>';q('start').disabled=true}else q('config').innerHTML='<b>Scanner session ready.</b><p class="muted">Session '+esc(session.slice(0,12))+'... This link expires automatically.</p>'}function popup(r,error){var card=q('scanCard');card.className='scan-card '+(error?'error':r.status==='L'?'late':'');q('scanIcon').textContent=error?'×':r.status==='L'?'!':'✓';q('scanStatus').textContent=error?'ATTENDANCE REJECTED':r.status==='L'?'LATE CHECK-IN':'ATTENDANCE RECORDED';q('scanName').textContent=error?'Unable to record':(r.student&&r.student.name)||'Student';q('scanDetails').innerHTML=error?'':[['Student ID',r.student&&r.student.studentId],['Class','Class '+(r.student&&r.student.classCode||'N/A')],['Course',r.student&&r.student.course],['Study Year / Program',((r.student&&r.student.year)||'')+' · '+((r.student&&r.student.program)||'')],['Status',r.statusLabel||r.status],['Check-in',r.checkInDisplay||r.checkIn]].map(function(x){return'<div class="info"><span>'+esc(x[0])+'</span><b>'+esc(x[1]||'N/A')+'</b></div>'}).join('');q('scanMessage').textContent=error?error:(r.duplicate?'This student was already recorded. Original check-in preserved.':'Confirmed by ANI LMS backend.');q('scanModal').classList.add('show')}function closePopup(){q('scanModal').classList.remove('show')}async function start(){stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});q('video').srcObject=stream;await q('video').play();q('placeholder').style.display='none';show('Camera active. Present a student QR code.');loop()}catch(e){show('Camera error: '+e.message,'bad')}}function stop(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;q('video').srcObject=null;q('placeholder').style.display='block'}function loop(){var v=q('video'),c=q('canvas');if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);var d=x.getImageData(0,0,c.width,c.height),f=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});if(f&&f.data&&f.data!==last&&!busy){last=f.data;submit(f.data)}}raf=requestAnimationFrame(loop)}function submit(qr){busy=true;show('QR detected. Verifying with ANI LMS...');var cb='aniScan_'+Date.now(),s=document.createElement('script'),timer;window[cb]=function(r){clearTimeout(timer);delete window[cb];s.remove();if(r&&r.ok){show('Attendance confirmed for '+(r.student.name||r.student.studentId)+'.','good');popup(r,'');if(navigator.vibrate)navigator.vibrate([80,40,120])}else{show('Attendance rejected: '+((r&&r.message)||'Unknown error'),'bad');popup({},(r&&r.message)||'Unknown backend error')}setTimeout(function(){closePopup();busy=false;last='';show('Ready for the next student.')},cooldown)};s.onerror=function(){clearTimeout(timer);delete window[cb];s.remove();popup({},'Unable to reach ANI LMS. Check the current deployment URL.');setTimeout(function(){closePopup();busy=false;last=''},cooldown)};s.src=endpoint+(endpoint.indexOf('?')>=0?'&':'?')+'action=scanAttendanceExternal&sessionId='+encodeURIComponent(session)+'&scannerToken='+encodeURIComponent(token)+'&qrToken='+encodeURIComponent(qr)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.body.appendChild(s);timer=setTimeout(function(){if(window[cb]){delete window[cb];s.remove();popup({},'ANI LMS did not respond within 15 seconds. Create a new scanner session.');setTimeout(function(){closePopup();busy=false;last=''},cooldown)}},15000)}q('start').onclick=start;q('stop').onclick=stop;q('switch').onclick=function(){facing=facing==='environment'?'user':'environment';start()};configure()}());</script></body></html>
