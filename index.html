<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ANI Attendance Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root{--navy:#003b5c;--blue:#0072ce;--green:#067647;--red:#b42318;--bg:#eef3f8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#243746}header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:22px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #003b5c18}.scanner{height:520px;background:#101827;border-radius:16px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.frame{position:absolute;width:min(65%,320px);aspect-ratio:1;border:3px solid #fff;border-radius:22px}.frame:after{content:"";position:absolute;left:8%;right:8%;height:3px;top:10%;background:#2bd3a2;box-shadow:0 0 12px #2bd3a2;animation:scan 2s infinite}@keyframes scan{50%{top:88%}}button{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}.danger{background:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{padding:14px;border-radius:10px;background:#f4f7f9;margin-top:12px}.good{background:#dcfae6;color:var(--green)}.bad{background:#fee4e2;color:var(--red)}.muted{color:#64748b;font-size:13px}@media(max-width:600px){.scanner{height:430px}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>ANI Attendance Scanner</h1><div>External secure camera scanner</div></div></header>
<main class="wrap">
  <div id="config" class="card"></div>
  <div class="card">
    <div class="scanner"><video id="video" playsinline muted></video><canvas id="canvas" hidden></canvas><div id="placeholder">Camera is off</div><div class="frame"></div></div>
    <div class="actions"><button id="start">Start Camera</button><button id="switch">Switch Camera</button><button id="stop" class="danger">Stop</button></div>
    <div id="result" class="result">Ready.</div>
  </div>
</main>
<iframe id="postTarget" name="postTarget" title="Attendance submission" hidden></iframe>
<form id="scanPostForm" method="post" target="postTarget" hidden>
  <input name="action" value="scanAttendanceExternal">
  <input id="formSessionId" name="sessionId">
  <input id="formScannerToken" name="scannerToken">
  <input id="formQrToken" name="qrToken">
</form>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var session=params.get('session')||'', token=params.get('token')||'', endpoint=params.get('endpoint')||'';
  var stream=null, raf=null, facing='environment', busy=false, last='', cooldown=1800;
  function q(id){return document.getElementById(id)}
  function show(text,type){q('result').textContent=text;q('result').className='result '+(type||'')}
  function configure(){if(!session||!token||!endpoint){q('config').innerHTML='<b>Invalid scanner link.</b><p>Open this scanner from the Lecturer Attendance page.</p>';q('start').disabled=true;}else{q('config').innerHTML='<b>Scanner session ready.</b><p class="muted">Session '+session.slice(0,12)+'... This link expires automatically.</p>';}}
  async function startCamera(){stopCamera();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});q('video').srcObject=stream;await q('video').play();q('placeholder').style.display='none';show('Camera active. Present a student QR code.');scanLoop();}catch(e){show('Camera error: '+e.message,'bad');}}
  function stopCamera(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;q('video').srcObject=null;q('placeholder').style.display='block';}
  function scanLoop(){var v=q('video'),c=q('canvas');if(v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;var ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0);var d=ctx.getImageData(0,0,c.width,c.height);var found=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});if(found&&found.data&&found.data!==last&&!busy){last=found.data;submitScan(found.data);}}raf=requestAnimationFrame(scanLoop);}
  function submitScan(qr){
    if(busy)return; busy=true; show('QR detected. Sending attendance...');
    var form=q('scanPostForm'); form.action=endpoint;
    q('formSessionId').value=session; q('formScannerToken').value=token; q('formQrToken').value=qr;
    var done=false;
    function complete(){if(done)return;done=true;show('Attendance request sent. Refresh the Lecturer roster to verify.','good');if(navigator.vibrate)navigator.vibrate([80,40,120]);setTimeout(function(){busy=false;last='';show('Ready for the next student.');},cooldown);}
    q('postTarget').onload=complete;
    try{form.submit();setTimeout(complete,1500);}catch(e){busy=false;last='';show('Submission failed: '+e.message,'bad');}
  }
  q('start').onclick=startCamera; q('stop').onclick=stopCamera; q('switch').onclick=function(){facing=facing==='environment'?'user':'environment';startCamera();}; configure();
}());
</script>
</body>
</html>
